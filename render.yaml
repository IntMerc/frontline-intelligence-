services:
  - type: web
    name: frontline-intelligence
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: frontline-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
